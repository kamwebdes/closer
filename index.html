<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<meta name="description" content="Estimates that get answered. Build quotes on your phone and never forget a follow-up.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
@media print{.top,.nav,.toast,.row,.stickybar,.banner,.notice,.btn,.sec-head,p.muted,.linkbtn,.pill,h1{display:none!important}.app{padding:0}.doc-wrap{border:0;overflow:visible}body{background:#fff;padding:0}}
</style>
<title>Closer Estimates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field tool for a phone on a job site. Big targets, high contrast, money always visible. The estimate itself is white paper in both themes. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --raised:#ECEEF2; --line:#DCE0E6; --fg:#131921; --muted:#596373; --dim:#8892A1;
  --accent:#DB5410; --accent-ink:#FFFFFF; --accent-soft:#DB54101A;
  --good:#1D8A57; --good-soft:#1D8A571A; --warn:#A86F12; --warn-soft:#C9861A22; --bad:#BF3F39; --bad-soft:#BF3F391A; --info:#2D66D0; --info-soft:#2D66D01A;
  --paper:#FFFFFF; --paper-ink:#131921; --paper-muted:#5E6878; --paper-line:#E1E4E9;
  --f-display:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#161B22; --raised:#1D232B; --line:#2A313B; --fg:#E8ECF1; --muted:#A1AAB7; --dim:#6F7886;
  --accent:#FF7A2E; --accent-ink:#1A0D04; --accent-soft:#FF7A2E22;
  --good:#3EC285; --good-soft:#3EC28522; --warn:#E3AA3E; --warn-soft:#E3AA3E22; --bad:#F06B64; --bad-soft:#F06B6422; --info:#6E9DFF; --info-soft:#6E9DFF22;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --raised:#1D232B; --line:#2A313B; --fg:#E8ECF1; --muted:#A1AAB7; --dim:#6F7886;
  --accent:#FF7A2E; --accent-ink:#1A0D04; --accent-soft:#FF7A2E22;
  --good:#3EC285; --good-soft:#3EC28522; --warn:#E3AA3E; --warn-soft:#E3AA3E22; --bad:#F06B64; --bad-soft:#F06B6422; --info:#6E9DFF; --info-soft:#6E9DFF22;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:.005em;line-height:1.05}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em}
h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad);background:transparent;border-color:var(--bad-soft)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14.5px}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 130px}

.banner{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14.5px;background:var(--info-soft);color:var(--fg)}
.banner.bad{background:var(--bad-soft)}
.banner button{background:none;border:0;color:var(--info);font-weight:700;padding:0;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted)}
.stat.alert b{color:var(--warn)}

/* follow up */
.fu{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--warn)}
.fu-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fu-top b{font-size:17px}
.fu-amt{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.msg{background:var(--raised);border-radius:10px;padding:10px 12px;font-size:14.5px;color:var(--fg)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.qrow:first-child{border-top:0}
.qrow .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.qrow .amt{font-family:var(--f-display);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.qrow .sub{font-size:13.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;justify-self:end;align-self:center}
.pill.draft{background:var(--raised);color:var(--muted)}
.pill.sent{background:var(--info-soft);color:var(--info)}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.won{background:var(--good-soft);color:var(--good)}
.pill.lost{background:var(--bad-soft);color:var(--bad)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.add{border-style:dashed}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:13.5px;font-weight:600;color:var(--muted)}
.input{width:100%;min-width:0;min-height:48px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.input:focus{border-color:var(--accent);outline:none}
.input::placeholder{color:var(--dim)}
textarea.input{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.line{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.line-nums{display:grid;grid-template-columns:70px 90px 1fr auto;gap:8px;align-items:end}
.line-amt{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:right;padding-bottom:12px;font-variant-numeric:tabular-nums}
.line .input{min-height:44px}
.xbtn{background:none;border:0;color:var(--dim);font-size:22px;line-height:1;padding:8px;border-radius:8px;align-self:end;margin-bottom:4px}
.xbtn:hover{color:var(--bad)}
.totals{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .grand{font-family:var(--f-display);font-weight:700;font-size:26px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.err{color:var(--bad);font-size:14px}
.stickybar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--bg);padding-block:10px;display:flex;gap:10px}
.stickybar .btn{flex:1}

/* document */
.doc-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.doc{background:var(--paper);color:var(--paper-ink);padding:22px;min-width:340px;font-size:14px;color-scheme:light}
.doc-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--paper-ink);padding-bottom:14px}
.doc-biz b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;display:block}
.doc-biz p,.doc-meta p{color:var(--paper-muted);font-size:13px}
.doc-meta{text-align:right}
.doc-meta .kind{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.08em;color:var(--accent)}
.doc-meta .mono{font-family:var(--f-mono);font-size:12.5px;color:var(--paper-muted)}
.doc-to{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
.doc-to small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--paper-muted);display:block;margin-bottom:2px}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--paper-line)}
.doc td{padding:9px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.doc .r{text-align:right;white-space:nowrap}
.doc-tot{margin-left:auto;width:min(100%,260px);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.doc-tot div{display:flex;justify-content:space-between;gap:10px}
.doc-tot .grand{font-family:var(--f-display);font-weight:700;font-size:22px;border-top:2px solid var(--paper-ink);padding-top:6px;margin-top:4px}
.doc-tot .dep{color:var(--accent);font-weight:700}
.doc-notes{margin-top:16px;font-size:13px;color:var(--paper-muted);white-space:pre-wrap}
.doc-sign{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:28px;font-size:12px;color:var(--paper-muted)}
.doc-sign div{border-top:1px solid var(--paper-ink);padding-top:4px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.nav button{background:none;border:0;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--dim)}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button.newbtn span.plus{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-4px}
.nav button.newbtn svg{width:24px;height:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 16px;display:flex;gap:14px;align-items:center;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px #0004}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}

.pill.expired{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;background:var(--raised);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0002}
.flabel-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.taxbox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
.taxbox input{width:20px;height:20px;accent-color:var(--accent)}
.line-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.notice{border-radius:12px;padding:10px 12px;font-size:14.5px;background:var(--warn-soft)}
.doc-logo{max-height:56px;max-width:160px;display:block;margin-bottom:6px;object-fit:contain}
.hist{font-size:14px;display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.hist div:first-child{border-top:0;padding-top:0}
.logo-prev{width:72px;height:72px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:contain}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:400px){.line-nums{grid-template-columns:60px 80px 1fr auto}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.view-in{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><b>C</b>Closer</div><div id="topright"></div></header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Main"><div class="nav-in" id="navin"></div></nav>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY='closer.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
const USD=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>USD.format(r2(n));
const moneyShort=n=>n>=10000?'$'+(n/1000).toFixed(n>=100000?0:1)+'k':money(n).replace(/\.00$/,'');
const fdate=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function ago(t){const d=Math.floor((Date.now()-t)/DAY);return d<=0?'today':d===1?'yesterday':d+' days ago'}
const first=n=>(n||'').trim().split(/\s+/)[0]||'there';
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const IC={
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  list:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- data ---------- */
function line(desc,qty,unit,price,taxable){return {id:uid(),desc,qty,unit,price,taxable:taxable!==false}}
function seed(){
  const now=Date.now();
  const biz={name:'Ridgeline Home Repair',owner:'Sam Ortiz',phone:'(305) 555-0142',email:'sam@ridgeline.example',license:'Lic. #CGC-000000',address:'Homestead, FL',logo:'',taxRate:7,depositPct:30,followDays:3,validDays:30,nextNum:1005,
    terms:'Deposit due to schedule the job. Balance due on completion. Estimate valid for 30 days. Price may change if hidden damage is found.'};
  const q=(num,client,title,lines,status,daysAgo,extra)=>Object.assign({id:uid(),num,client,title,lines,discount:0,discountType:'$',taxRate:7,depositType:'%',depositPct:30,depositAmt:0,notes:'',status,created:now-daysAgo*DAY,sentAt:status==='draft'?null:now-daysAgo*DAY,followUps:[],decidedAt:null,snoozeUntil:null,history:[]},extra||{});
  return {v:1,sample:true,biz,editing:null,
    items:[{id:uid(),desc:'Labor',unit:'hr',price:75,taxable:false},{id:uid(),desc:'Shingle repair',unit:'sq',price:325,taxable:true},{id:uid(),desc:'Drip edge',unit:'ft',price:4.5,taxable:true},{id:uid(),desc:'Debris removal & haul-away',unit:'job',price:250,taxable:false},{id:uid(),desc:'Permit fee',unit:'ea',price:150,taxable:false}],
    quotes:[
      q(1001,{name:'Maria Lopez',phone:'(305) 555-0198',email:'',address:'SW 296th St'},'Roof leak repair, back porch',[line('Shingle repair',2,'sq',325),line('Labor',6,'hr',75,false),line('Debris removal & haul-away',1,'job',250,false)],'sent',5),
      q(1002,{name:'Derek Chen',phone:'(305) 555-0117',email:'',address:''},'Gutter replacement, front of house',[line('Seamless aluminum gutter',64,'ft',9.5),line('Downspouts',3,'ea',85),line('Labor',5,'hr',75,false)],'sent',1),
      q(1003,{name:'Angela Brooks',phone:'(305) 555-0133',email:'',address:''},'Fascia board replacement',[line('Fascia board',40,'ft',12),line('Labor',8,'hr',75,false),line('Paint & primer',1,'job',180)],'won',9,{decidedAt:now-6*DAY}),
      q(1004,{name:'Tom Reyes',phone:'',email:'',address:''},'Full roof inspection & report',[line('Inspection',1,'job',225,false)],'draft',0)
    ]};
}
function normalize(d){
  d.biz=Object.assign({name:'My Business',owner:'',phone:'',email:'',license:'',address:'',logo:'',taxRate:0,depositPct:0,followDays:3,validDays:30,nextNum:1001,terms:''},d.biz||{});
  d.items=(d.items||[]).map(i=>Object.assign({taxable:true},i));
  d.quotes=(d.quotes||[]).map(q=>{
    q=Object.assign({discount:0,discountType:'$',taxRate:0,depositType:'%',depositPct:0,depositAmt:0,notes:'',followUps:[],decidedAt:null,snoozeUntil:null,history:[],client:{}},q);
    q.client=Object.assign({name:'',phone:'',email:'',address:''},q.client);
    q.lines=(q.lines||[]).map(l=>Object.assign({id:uid(),desc:'',qty:1,unit:'',price:0,taxable:true},l));
    return q;});
  if(d.editing&&!d.editing.draft)d.editing=null;
  d.v=1;return d;
}
let storageOk=true;try{localStorage.setItem('__c','1');localStorage.removeItem('__c')}catch(e){storageOk=false}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1&&Array.isArray(d.quotes)&&d.biz)return normalize(d)}}catch(e){}return normalize(seed())}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false;toast('Couldn\'t save. Storage may be full. Try removing your logo.')}updateBadge()}
function save(){S.updatedAt=Date.now();saveLocal();if(typeof schedulePush==='function')schedulePush()}
let S=load();
let view='home',curId=null,filter='all',query='',draft=null,dirty=false,asInvoice=false,confirmDel=false,confirmDiscard=false,pendingRestore=null,toastTimer=null,undoFn=null;
if(S.editing&&S.editing.dirty){draft=S.editing.draft;dirty=true;view='edit'}else S.editing=null;

/* ---------- money logic ---------- */
function calc(q){
  let sub=0,taxSub=0;
  for(const l of q.lines){const a=(+l.qty||0)*(+l.price||0);sub+=a;if(l.taxable!==false)taxSub+=a}
  let disc=q.discountType==='%'?sub*(+q.discount||0)/100:(+q.discount||0);
  disc=Math.min(Math.max(disc,0),sub);
  const taxBase=sub>0?taxSub-disc*(taxSub/sub):0;
  const tax=Math.max(0,taxBase)*(+q.taxRate||0)/100;
  const total=sub-disc+tax;
  const deposit=q.depositType==='$'?Math.min(Math.max(+q.depositAmt||0,0),total):total*(+q.depositPct||0)/100;
  return {sub,taxSub,disc,tax,total,deposit};
}
const depLabel=q=>q.depositType==='$'?'Deposit to schedule':`Deposit to schedule (${+q.depositPct||0}%)`;
const byId=id=>S.quotes.find(q=>q.id===id);
const maxNum=()=>S.quotes.reduce((m,q)=>Math.max(m,+q.num||0),0);
function lastTouch(q){return Math.max(q.sentAt||0,...q.followUps)}
function validUntil(q){return (q.sentAt||q.created)+(S.biz.validDays||30)*DAY}
function isExpired(q){return q.status==='sent'&&Date.now()>validUntil(q)}
function isDue(q){return q.status==='sent'&&Date.now()>=(q.snoozeUntil||0)&&Date.now()-lastTouch(q)>=S.biz.followDays*DAY}
function statusOf(q){return isDue(q)?'due':isExpired(q)?'expired':q.status}
const STATUS_LABEL={draft:'Draft',sent:'Sent',due:'Follow up',expired:'Expired',won:'Won',lost:'Lost'};
function updateBadge(){const n=S.quotes.filter(isDue).length;document.title=n?`(${n}) Closer Estimates`:'Closer Estimates';try{if(navigator.setAppBadge){n?navigator.setAppBadge(n).catch(()=>{}):navigator.clearAppBadge().catch(()=>{})}}catch(e){}}

const sig=()=>S.biz.owner||S.biz.name;
function sendMsg(q){const t=calc(q);return `Hi ${first(q.client.name)}, here's your estimate #${q.num} for ${q.title}: ${money(t.total)} total${t.deposit>0?`, with a ${money(t.deposit)} deposit to get you on the schedule`:''}. Let me know if you have any questions. – ${sig()}, ${S.biz.name}`}
function followMsg(q){const n=q.followUps.length,t=money(calc(q).total);
  if(isExpired(q))return `Hi ${first(q.client.name)}, the estimate for ${q.title} (${t}) has passed its valid date. If you're still interested, I'm happy to confirm the price or update it for you. – ${sig()}`;
  if(n===0)return `Hi ${first(q.client.name)}, just checking in on the estimate I sent for ${q.title} (${t}). Happy to answer questions or adjust anything. – ${sig()}`;
  if(n===1)return `Hi ${first(q.client.name)}, wanted to follow up on your ${q.title} estimate. I have openings coming up and can get you scheduled soon. Want me to hold a spot? – ${sig()}`;
  return `Hi ${first(q.client.name)}, I'll close out the ${q.title} estimate for now. If you'd like to move forward later, just reply here and I'll take care of you. – ${sig()}`;}
function smsHref(phone,body){const p=(phone||'').replace(/[^\d+]/g,'');return `sms:${p}${/iPhone|iPad|iPod/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(body)}`}

/* ---------- toast & clipboard ---------- */
function toast(msg,undo){const el=$('#toast');undoFn=undo||null;el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;undoFn=null},undo?5000:2800)}
function copyText(text,okMsg){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?okMsg:'Copy was blocked here. Long-press the text to copy it.')};
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),fallback)}catch(e){fallback()}
}

function qRow(q){const st=statusOf(q),t=calc(q).total;
  const when=q.status==='draft'?'created '+ago(q.created):q.status==='sent'?'sent '+ago(q.sentAt):(q.status==='won'?'won ':'lost ')+ago(q.decidedAt||q.created);

function customers(){
  const m=new Map();
  S.quotes.slice().sort((a,b)=>b.created-a.created).forEach(q=>{const k=(q.client.name||'').trim().toLowerCase();if(k&&!m.has(k))m.set(k,q.client)});
  return [...m.values()];
}

/* ---------- home ---------- */
function followCard(q){
  const t=calc(q).total,n=q.followUps.length,exp=isExpired(q);
  const status=n?`followed up ${n}× · last ${ago(lastTouch(q))}`:`sent ${ago(q.sentAt)}, no answer`;
  if(n>=3)return `<div class="card fu"><div class="fu-top"><span><b>${esc(q.client.name)}</b><br><span class="muted" style="font-size:14px">${esc(q.title)} · ${status}</span></span><span class="fu-amt">${money(t)}</span></div>
    <p class="muted" style="font-size:14.5px">You've followed up ${n} times with no answer. Most jobs that go this quiet don't come back, so it's usually time to close it out.</p>
    <div class="row"><button class="btn danger sm" data-act="lost" data-id="${q.id}">Close it out (lost)</button><button class="btn sm" data-act="snooze" data-id="${q.id}">Remind me in 2 weeks</button></div>
    <div class="row"><button class="btn good sm" data-act="won" data-id="${q.id}">${ic('check')}They said yes</button></div></div>`;
  return `<div class="card fu"><div class="fu-top"><span><b>${esc(q.client.name)}</b><br><span class="muted" style="font-size:14px">${esc(q.title)} · ${status}${exp?' · <b style="color:var(--bad)">expired</b>':''}</span></span><span class="fu-amt">${money(t)}</span></div>
    <div class="msg">${esc(followMsg(q))}</div>
    <div class="row">${!inFrame&&q.client.phone?`<a class="btn primary sm" href="${esc(smsHref(q.client.phone,followMsg(q)))}" data-act="sms-follow" data-id="${q.id}">${ic('chat')}Text it</a>`:''}<button class="btn ${!inFrame&&q.client.phone?'':'primary'} sm" data-act="copy-follow" data-id="${q.id}">${ic('copy')}Copy message</button><button class="btn sm" data-act="mark-follow" data-id="${q.id}">I sent it</button></div>
    <div class="row"><button class="btn good sm" data-act="won" data-id="${q.id}">${ic('check')}They said yes</button><button class="btn danger sm" data-act="lost" data-id="${q.id}">Lost it</button><button class="btn sm" data-act="snooze-short" data-id="${q.id}">Later</button></div></div>`;
}
function renderHome(){
  const now=new Date(),monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const open=S.quotes.filter(q=>q.status==='sent');
  const openVal=open.reduce((m,q)=>m+calc(q).total,0);

  const rate=decided.length?Math.round(100*decided.filter(q=>q.status==='won').length/decided.length):null;
  const due=S.quotes.filter(isDue).sort((a,b)=>lastTouch(a)-lastTouch(b));
  const hr=now.getHours(),greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  let h=`<div class="stack view-in">

  ${banners()}
  <div class="stats">
    <div class="stat"><b>${moneyShort(openVal)}</b><span>waiting on ${open.length} answer${open.length===1?'':'s'}</span></div>
    <div class="stat"><b>${moneyShort(wonVal)}</b><span>won this month</span></div>
    <div class="stat ${due.length?'alert':''}"><b>${due.length}</b><span>follow-up${due.length===1?'':'s'} due</span></div>

  h+=due.length?due.map(followCard).join(''):`<div class="card empty" style="padding:18px">${open.length?`Nothing due. Closer reminds you ${S.biz.followDays} days after you send or follow up.`:'No open estimates. Send one and Closer will remind you to follow up.'}</div>`;

  const clean=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
  if(p.get('error')||p.get('error_description')){clean();view='settings';render();toast(friendlyLinkErr(p.get('error_description')||p.get('error')));return true}
  const at=p.get('access_token');if(!at)return false;
  clean();
  try{
    const u=await rawFetch('/auth/v1/user',{token:at});
    setSession({access_token:at,refresh_token:p.get('refresh_token'),expires_at:+p.get('expires_at')||Math.floor(Date.now()/1000)+(+p.get('expires_in')||3600),user:{id:u.id,email:u.email}});
    if(p.get('type')==='recovery'){recoveryMode=true;view='settings';render();toast('Choose a new password below.');return true}
    await firstSync();view=S.biz.name?'home':'settings';render();toast('Email confirmed. You\'re signed in and backed up.');return true;
  }catch(e){view='settings';render();toast(e.message);return true}
}

function authMsg(t,bad){const el=$('#auth-msg');if(el)el.innerHTML=t?`<p class="${bad?'err':'muted'}" style="font-size:14.5px">${esc(t)}</p>`:''}
function authBusy(b){document.querySelectorAll('#authform button').forEach(x=>x.disabled=b)}
async function doAuth(mode){
  const email=($('#a-email').value||'').trim(),pass=$('#a-pass').value||'';
  if(!/^\S+@\S+\.\S+$/.test(email)){authMsg('Enter a valid email address.',true);return}
  if(pass.length<8){authMsg('Use a password with at least 8 characters.',true);return}
  authBusy(true);authMsg(mode==='up'?'Creating your account…':'Signing in…');
  try{
    if(mode==='up'){const r=await signUpReq(email,pass);if(r==='confirm'){authBusy(false);authMsg('Almost done. We emailed you a link to confirm your address. Tap it and you\'ll be signed in. Check your spam folder if you don\'t see it.');return}}
    else await signInReq(email,pass);
    render();toast(S.biz.name?'Signed in. Your estimates are backed up.':'Signed in. Add your business details below.');
  }catch(e){authBusy(false);authMsg(friendlyAuth(e.message),true)}
}
async function signInReq(email,password){const d=await rawFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});setSession(fromTokenResp(d));await firstSync()}
async function signUpReq(email,password){const d=await rawFetch('/auth/v1/signup?redirect_to='+encodeURIComponent(siteURL()),{method:'POST',body:{email,password}});if(d&&d.access_token){setSession(fromTokenResp(d));await firstSync();return 'in'}if(d&&d.session&&d.session.access_token){setSession(fromTokenResp(Object.assign({user:d.user},d.session)));await firstSync();return 'in'}return 'confirm'}

  if(f.id==='bizform'){
    const v=id=>$(id).value.trim(),n=id=>parseFloat($(id).value);const err=$('#biz-err');
    if(!v('#b-name')){err.textContent='Add your business name.';return}
    const tax=n('#b-tax'),dep=n('#b-dep'),fu=parseInt($('#b-fu').value,10),valid=parseInt($('#b-valid').value,10),next=parseInt($('#b-next').value,10);
    if(!(tax>=0&&tax<=30)){err.textContent='Tax must be between 0 and 30%.';return}
    if(!(dep>=0&&dep<=100)){err.textContent='Deposit must be between 0 and 100%.';return}
    if(!(fu>=1&&fu<=30)){err.textContent='Follow-up reminder must be 1 to 30 days.';return}
    if(!(valid>=1&&valid<=365)){err.textContent='Estimates must be valid for 1 to 365 days.';return}
    const mx=maxNum();if(!(next>mx)){err.textContent=`Estimate #${mx} already exists. Use ${mx+1} or higher so numbers don't repeat.`;return}
    Object.assign(S.biz,{name:v('#b-name'),owner:v('#b-owner'),phone:v('#b-phone'),email:v('#b-email'),license:v('#b-lic'),address:v('#b-addr'),taxRate:tax,depositPct:dep,followDays:fu,validDays:valid,nextNum:next,terms:$('#b-terms').value.trim()});
    save();render();toast('Business details saved');
  }
  if(f.id==='itemform'){
    const d=$('#i-desc').value.trim(),u=$('#i-unit').value.trim(),p=parseFloat($('#i-price').value),err=$('#item-err');
    if(!d){err.textContent='Name the item.';return}
    if(!(p>=0)){err.textContent='Add a rate (0 or more).';return}
    S.items.push({id:uid(),desc:d,unit:u,price:p,taxable:$('#i-tax').checked});save();render();toast(`Saved “${d}”`);
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view!=='edit'){render();if(session)syncNow()}});
window.addEventListener('online',()=>{if(session)syncNow()});

render();
handleAuthHash().then(h=>{if(!h&&session)syncNow()});
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
